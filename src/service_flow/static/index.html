<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServiceFlow · 售后协作工作台</title><style>
:root{--ink:#182c37;--muted:#627681;--line:#dce5e8;--brand:#126c65;--bg:#f3f6f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "Microsoft YaHei",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;padding:9px 14px;color:var(--ink)}button:hover{border-color:var(--brand)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--brand);color:white;border-color:var(--brand)}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:white;border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:750;letter-spacing:-1px}.brand span{color:var(--brand)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted)}.status{font-size:12px;color:var(--brand)}.shell{max-width:1480px;margin:auto;padding:24px}.intro{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}h1{font-size:24px;margin:0 0 4px}p{margin:0;color:var(--muted)}.tabs{display:flex;gap:8px}.tabs .active{background:var(--ink);color:white}.layout{display:grid;grid-template-columns:260px minmax(320px,1fr) 280px;gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{padding:17px 20px;border-bottom:1px solid var(--line);font-weight:650;display:flex;justify-content:space-between;align-items:center}.pad{padding:18px}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}select,input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}textarea{resize:vertical;min-height:80px}select:focus,textarea:focus{outline:2px solid #a5d7cf}.list{max-height:450px;overflow:auto}.item{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;padding:15px 18px}.item.selected{background:#ecf6f3;border-left:3px solid var(--brand)}.item small{display:block;color:var(--muted)}.pill{display:inline-block;font-size:11px;border-radius:20px;padding:2px 9px;background:#e8f4ef;color:#196e57}.pill.warn{background:#fff0d9;color:#995f14}.banner{padding:12px 18px;background:#edf5f3;color:#276057;border-bottom:1px solid var(--line);font-size:13px}.banner.urgent{background:#fff0eb;color:#9c3b29}.messages{height:440px;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:18px}.bubble{max-width:92%;border-radius:10px;padding:12px 15px;background:#f0f4f5;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#e4f2ee}.bubble.staff{border-left:3px solid var(--brand)}.bubble.system{align-self:center;background:none;color:var(--muted);font-size:12px;text-align:center}.by{font-size:11px;color:var(--muted);margin-bottom:5px}.citation{font-size:11px;color:#43776e;margin-top:8px}.composer{border-top:1px solid var(--line);padding:16px}.actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{font-size:12px;padding:5px 9px;color:var(--muted)}.empty{margin:auto;text-align:center;color:var(--muted);max-width:300px}.detail{padding:16px 0;border-bottom:1px solid var(--line)}.detail small{display:block;color:var(--muted)}.detail strong{font-size:15px}.note{font-size:12px;color:var(--muted);padding:14px;background:#f6f8f8;border-radius:8px;margin-top:16px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#283b44;color:white;border-radius:8px;z-index:5;max-width:90%}footer{font-size:11px;color:var(--muted);margin-top:18px;display:flex;justify-content:space-between}.hide{display:none!important}dialog{border:1px solid var(--line);border-radius:14px;max-width:460px;padding:24px}dialog::backdrop{background:#18303c55}dialog h2{margin-top:0}@media(max-width:1100px){.layout{grid-template-columns:220px 1fr}.right{grid-column:1/-1}.right .pad{display:flex;gap:24px;flex-wrap:wrap}}@media(max-width:700px){header{padding:0 16px}.shell{padding:16px}.intro{display:block}.tabs{margin-top:14px}.layout{grid-template-columns:1fr}.list{max-height:180px}.messages{height:380px}.brand{font-size:20px}}
</style></head><body>
<header><div><div class="brand">Service<span>Flow</span></div><div class="eyebrow">CUSTOMER CARE WORKSPACE</div></div><div id="health" class="status">连接服务中…</div></header>
<main class="shell"><div class="intro"><div><h1 id="pageTitle">每一个问题，都有后续</h1><p>从产品排障到人工协作，在同一会话中持续处理。</p></div><nav class="tabs"><button id="customerTab" class="active">客户服务</button><button id="staffTab">客服工作台</button></nav></div>
<div class="layout"><aside class="panel"><div class="panel-head" id="listTitle">我的会话</div><div class="pad"><label for="identity">当前身份</label><select id="identity"></select><div id="orderBox"><label for="order">选择订单</label><select id="order"></select><button class="primary" id="newChat" style="width:100%;margin-top:12px">＋ 新建售后会话</button></div><div id="tokenBox" class="hide"><label for="credential">访问凭据</label><input id="credential" type="password" autocomplete="off"><button id="loginToken">连接</button></div></div><div id="list" class="list"></div></aside>
<section class="panel"><div class="panel-head"><span id="chatTitle">售后会话</span><span id="state" class="pill">准备就绪</span></div><div id="banner" class="banner">请选择订单并新建会话。历史消息会保留，刷新后可以继续。</div><div id="messages" class="messages"><div class="empty">从一个具体问题开始<br>我们会保留排障过程，需要时由人工继续处理。</div></div><div class="composer"><div id="suggestions" class="chips"><button data-text="耳机蓝牙连不上怎么办？">蓝牙连接问题</button><button data-text="我试过了，还是不行">排障后仍未解决</button><button data-text="我想申请退款">申请退款</button><button data-text="请转人工处理">联系人工</button></div><label for="message" class="hide">输入消息</label><textarea id="message" placeholder="描述遇到的问题，或补充上一次的处理结果…"></textarea><div class="actions"><button id="claim" class="hide">接管会话</button><button id="resume" class="hide">恢复自动服务</button><button id="resolve" class="hide">结案</button><button class="primary" id="send">发送消息</button></div></div></section>
<aside class="panel right"><div class="panel-head">处理详情</div><div class="pad" id="details"><div class="note">在这里查看订单、会话状态和人工处理进度。</div></div></aside></div>
<footer><span id="mode">本地合成订单 · 退款仅写入模拟账本</span><span>会话持久化 · 明确确认 · 人工接管</span></footer></main>
<dialog id="confirmation"><h2>确认退款申请</h2><p id="confirmText"></p><div class="note">当前为本地模拟退款，不会产生真实资金交易。确认后会更新订单状态。</div><div class="actions"><button id="cancelConfirm">取消</button><button class="primary" id="doConfirm">确认提交</button></div></dialog><div id="toast" class="toast hide" role="alert"></div>
<script>
const $=id=>document.getElementById(id);let role='customer',token='',cid=null,current=null,orders=[],demo=true,pendingToken='',busy=false,lastSignature='',generation=0;
const states={bot:'自动服务中',waiting_human:'等待人工',human:'人工处理中',resolved:'已结案'};
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),4500)}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...options.headers}});let data;try{data=await r.json()}catch{throw Error('服务响应异常')}if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'输入格式有误，请检查后重试');return data}
function post(path,data={}){return api(path,{method:'POST',body:JSON.stringify(data)})}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function login(){generation++;cid=null;current=null;lastSignature='';$('messages').replaceChildren(el('div','请选择会话或新建会话。','empty'));$('state').textContent='准备就绪';$('banner').textContent='请选择会话';$('details').replaceChildren();if(demo){const r=await post('/api/demo/login',{role,identity:$('identity').value});token=r.token}else{token=$('credential').value;if(!token)return;const me=await api('/api/me');if(me.role!==role)throw Error('凭据角色与当前工作台不匹配');const option=el('option',me.id);option.value=me.id;$('identity').replaceChildren(option)}if(role==='customer'){orders=await api('/api/orders');$('order').replaceChildren(...orders.map(o=>{let n=el('option',o.order_id+' · '+o.product);n.value=o.order_id;return n}))}await refreshList();const saved=sessionStorage.getItem('sf:'+role+':'+$('identity').value);if(saved){try{await select(saved)}catch{sessionStorage.removeItem('sf:'+role+':'+$('identity').value)}}}
async function switchRole(next){role=next;$('customerTab').classList.toggle('active',role==='customer');$('staffTab').classList.toggle('active',role==='staff');$('orderBox').classList.toggle('hide',role==='staff');$('suggestions').classList.toggle('hide',role==='staff');$('listTitle').textContent=role==='staff'?'待处理队列':'我的会话';$('identity').replaceChildren(...(role==='customer'?['C-001','C-002','C-003','C-004']:['S-001','S-002']).map(v=>{const o=el('option',v);o.value=v;return o}));await login()}
async function refreshList(){const g=generation;const rows=await api(role==='staff'?'/api/staff/queue':'/api/conversations');if(g!==generation)return;$('list').replaceChildren();if(!rows.length)$('list').append(el('div',role==='staff'?'目前没有待处理工单':'还没有售后会话','pad'));for(const row of rows){const n=el('button',undefined,'item'+(cid===row.id?' selected':''));n.append(el('strong',row.order_id),el('small',(states[row.state]||row.state)+(row.priority==='urgent'?' · 紧急':'')),el('small',row.reason||row.topic||'新的售后会话'));n.onclick=()=>select(row.id).catch(e=>toast(e.message));$('list').append(n)}}
async function select(id){sessionStorage.setItem('sf:'+role+':'+$('identity').value,id);cid=id;lastSignature='';await refresh();await refreshList()}
async function refresh(){if(!cid)return;const id=cid,g=generation;const row=await api('/api/conversations/'+id);if(id!==cid||g!==generation)return;current=row;const sig=JSON.stringify(row);if(sig===lastSignature)return;lastSignature=sig;render(row)}
function render(row){$('chatTitle').textContent=row.order_id+' · 售后会话';$('state').textContent=states[row.state];$('state').classList.toggle('warn',row.state==='waiting_human');$('banner').classList.toggle('urgent',row.priority==='urgent');$('banner').textContent=row.state==='waiting_human'?'已转人工，自动处理已暂停。可以继续补充信息，客服接管后会在此回复。':row.state==='human'?'客服 '+row.assignee+' 已接管。新的消息将发送给客服。':row.state==='resolved'?'会话已结案。需要其他帮助时，可以新建会话。':'自动服务已就绪。我们会结合本会话历史理解你的追问。';const box=$('messages'),nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.replaceChildren();for(const m of row.messages){let n=el('div',undefined,'bubble '+m.role);n.append(el('div',({user:role==='staff'?'客户':'你',assistant:'服务助手',staff:'人工客服',system:'处理进度'})[m.role]+' · '+new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),'by'),el('div',m.content));for(const c of m.metadata.citations||[])n.append(el('div','依据：'+(c.source||c.title),'citation'));if(role==='customer'&&m.metadata.confirmation_token&&m.metadata.confirmation_status==='pending'&&row.state==='bot'){const b=el('button','查看并确认退款');b.onclick=()=>{pendingToken=m.metadata.confirmation_token;$('confirmText').textContent=m.content;$('confirmation').showModal()};n.append(b)}box.append(n)}if(!row.messages.length)box.append(el('div','描述你的问题，我们从这里开始。','empty'));if(nearBottom||!row.messages.length)box.scrollTop=box.scrollHeight;$('claim').classList.toggle('hide',role!=='staff'||row.state!=='waiting_human');for(const id of ['resume','resolve'])$(id).classList.toggle('hide',role!=='staff'||row.state!=='human'||row.assignee!==$('identity').value);$('resume').disabled=row.priority==='urgent';$('send').disabled=busy||row.state==='resolved'||(role==='staff'&&(row.state!=='human'||row.assignee!==$('identity').value));$('details').replaceChildren();for(const [label,value] of [['订单编号',row.order_id],['产品',row.order.product],['实付金额','¥'+row.order.paid_amount.toFixed(2)],['订单状态',row.order.status==='refunded'?'已完成本地退款':'已签收'],['客户',row.customer_id],['处理状态',states[row.state]],['优先级',row.priority==='urgent'?'紧急安全问题':'普通'],['当前客服',row.assignee||'尚未分配'],['工单编号',row.ticket_id||'未创建'],['转接原因',row.reason||'—']]){let n=el('div',undefined,'detail');n.append(el('small',label),el('strong',value));$('details').append(n)}$('details').append(el('div','会话中的订单保持固定。人工接管期间不再执行自动退款或排障。','note'))}
async function send(){if(!cid)return toast('请先选择或新建会话');const text=$('message').value.trim();if(!text)return;if(busy)return;busy=true;$('send').disabled=true;try{if(role==='staff')await post('/api/staff/conversations/'+cid+'/action',{action:'reply',message:text});else await post('/api/conversations/'+cid+'/messages',{request_id:crypto.randomUUID(),message:text});$('message').value='';await refresh();$('messages').scrollTop=$('messages').scrollHeight;await refreshList()}catch(e){toast(e.message)}finally{busy=false;if(current)render(current)}}
function bind(id,fn){$(id).onclick=()=>Promise.resolve().then(fn).catch(e=>toast(e.message))}bind('customerTab',()=>switchRole('customer'));bind('staffTab',()=>switchRole('staff'));$('identity').onchange=()=>login().catch(e=>toast(e.message));bind('loginToken',login);bind('newChat',async()=>{const row=await post('/api/conversations',{order_id:$('order').value});await select(row.id)});bind('send',send);bind('claim',async()=>{await post('/api/staff/conversations/'+cid+'/claim');await refresh();await refreshList()});for(const action of ['resume','resolve'])bind(action,async()=>{const note=$('message').value.trim();if(!note)return toast('请在输入框填写处理结论，再执行此操作');await post('/api/staff/conversations/'+cid+'/action',{action,message:note});$('message').value='';await refresh();await refreshList()});$('cancelConfirm').onclick=()=>$('confirmation').close();bind('doConfirm',async()=>{$('doConfirm').disabled=true;try{await post('/api/conversations/'+cid+'/refund/confirm',{token:pendingToken});$('confirmation').close();await refresh()}finally{$('doConfirm').disabled=false}});document.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>{$('message').value=b.dataset.text;$('message').focus()});$('message').onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter')send()};
fetch('/health').then(r=>r.json()).then(async h=>{demo=h.demo_mode;$('health').textContent='● 服务在线 · '+(h.router==='rules'?'规则路由':'模型路由');$('tokenBox').classList.toggle('hide',demo);$('mode').textContent=demo?'演示模式 · 合成订单 · 无真实资金交易':'凭据认证模式 · 本地退款账本';await switchRole('customer')}).catch(e=>toast('连接失败：'+e.message));setInterval(()=>{if(token&&!busy){refresh().catch(()=>{});refreshList().catch(()=>{})}},3000);
</script></body></html>
